services:
  - type: web
    name: mosaic-changepp
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 10
    numInstances: 1
    envVars:
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_PATH
        value: /data/mosaic.sqlite
      - key: PIXABAY_API_KEY
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk:
      name: mosaic-data
      mountPath: /data
      sizeGB: 1
